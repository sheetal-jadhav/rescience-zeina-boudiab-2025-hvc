abstract: "Bou Diab, Chammas and Daou (2025, eLife) proposed a conductance-based network model of the songbird premotor nucleus HVC. Its three neuron classes, HVC(RA), HVC(X) and interneurons, are arranged as a chain of microcircuits with structured inhibition. We reimplemented the model independently in Python from the article, its supplement and the work it cites. Sparse, stereotyped propagation of HVC(RA) bursts reproduces in 50 of 50 random networks (3.95 spikes per burst, against 4.76 in the original), as does the narrow working window of the HVC(RA)-to-HVC(RA) conductance. The HVC(X) rebound bursts, dense interneuron firing, paired-recording calibration and sensitivity of the sequence to single-neuron changes do not reproduce from the published description. Neither the published HVC(X) cell nor the complete cell model it derives from can fire the original's ~500 Hz rebound bursts. The supplementary code does not implement the network, several equations in the appendix need correction, and default conductances are not reported. Results are also sensitive to integrator tolerance. We provide a tested open-source implementation, a log of all corrections and choices, and robustness analyses, including removal of HVC(X), which leaves propagation intact."

